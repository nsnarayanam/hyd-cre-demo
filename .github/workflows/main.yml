{"name":"Hyderabad CRE demo run","on":{"push":{"paths-ignore":["out/**","app.py"]},"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"run":{"runs-on":"ubuntu-latest","timeout-minutes":90,"env":{"AWS_NO_SIGN_REQUEST":"YES","GDAL_DISABLE_READDIR_ON_OPEN":"EMPTY_DIR"},"steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"run":"pip install -r requirements.txt"},{"run":"python pipeline.py 2>&1 | tee run.log"},{"name":"Show results","if":"always()","run":"echo ==== profiles.csv ====; cat out/profiles.csv || true; echo ==== last 30 log lines ====; tail -30 run.log"},{"uses":"actions/upload-artifact@v4","if":"always()","with":{"name":"hyderabad-cre-results","path":"out/\nrun.log"}},{"name":"Commit results","if":"success()","run":"git config user.name github-actions; git config user.email actions@github.com; git add out; git commit -m 'Add pipeline results' || echo nothing; git push"}]}}}
